[project]
name = "a-mealagent-v3"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain-anthropic>=1.4,<2.0",
    "neo4j-driver>=5.20,<6.0",
    "psycopg[binary]>=3.1,<4.0",
    "pytest>=7.4,<9.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tests/.pytest-tmp"
markers = [
    "integration: 调用真实外部服务的集成测试",
]

[tool.mealagent.test_database]
url = "postgresql+psycopg://mealagent:mealagent@127.0.0.1:5432/mealagent_test"
required_database = "mealagent_test"

[tool.mealagent.database]
url = "postgresql+psycopg://mealagent:mealagent@127.0.0.1:5432/mealagent"

[tool.mealagent.neo4j]
uri = "bolt://127.0.0.1:7687"
user = "neo4j"
password = "mealagent"

[tool.mealagent.test_neo4j]
uri = "bolt://127.0.0.1:7687"
user = "neo4j"
password = "mealagent"

[dependency-groups]
dev = [
    "pytest-html>=4.2.0",
]
