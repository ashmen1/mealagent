services:
  postgres:
    image: postgres:16-alpine
    container_name: mealagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealagent
      POSTGRES_PASSWORD: mealagent
      POSTGRES_DB: mealagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: mealagent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mealagent
    ports:
      - "127.0.0.1:17687:7687"
      - "127.0.0.1:17474:7474"
    volumes:
      - neo4j_data:/data

  neo4j-test:
    image: neo4j:5
    container_name: mealagent-neo4j-test
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mealagent
    ports:
      - "127.0.0.1:27687:7687"
      - "127.0.0.1:27474:7474"
    volumes:
      - neo4j_test_data:/data

volumes:
  postgres_data:
  neo4j_data:
  neo4j_test_data:
