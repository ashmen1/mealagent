services:
  postgres:
    image: postgres:16-alpine
    container_name: mealagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealagent
      POSTGRES_PASSWORD: mealagent
      POSTGRES_DB: mealagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: mealagent-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mealagent
    ports:
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data: