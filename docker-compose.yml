services:
  postgres:
    image: postgres:16-alpine
    container_name: mealagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mealagent
      POSTGRES_PASSWORD: mealagent
      POSTGRES_DB: mealagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: